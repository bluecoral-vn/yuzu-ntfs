# SPDX-License-Identifier: GPL-2.0-only
name: YuzuNTFS
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
  Release-Direct: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 37PX6W22C5
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
    Release-Direct:
      ONLY_ACTIVE_ARCH: NO
      CODE_SIGN_IDENTITY: "Developer ID Application: Nguyen Le (37PX6W22C5)"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp
packages:
  NTFSCore:
    path: Packages/NTFSCore
targets:
  YuzuNTFS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Yuzu NTFS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluecoral.vn.yuzuntfs
      configs:
        Release-Direct:
          PRODUCT_NAME: Yuzu NTFS
          PROVISIONING_PROFILE_SPECIFIER: Yuzu NTFS Developer ID
    postBuildScripts:
      - name: Embed P0 git identity and assert built metadata
        script: '"$SRCROOT/scripts/p0-build-identity.sh"'
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        basedOnDependencyAnalysis: false
    dependencies:
      - target: YuzuNTFSModule
        embed: true
        codeSign: false
  YuzuNTFSModule:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Module
        excludes: [Info.plist, YuzuNTFSModule.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluecoral.vn.yuzuntfs.fsmodule
        INFOPLIST_FILE: Module/Info.plist
        CODE_SIGN_ENTITLEMENTS: Module/YuzuNTFSModule.entitlements
        SKIP_INSTALL: YES
      configs:
        Debug:
          # Restricted FSKit entitlements require a profile in Xcode's signer.
          # This build-only spike uses the explicit ad-hoc signing step below.
          CODE_SIGNING_ALLOWED: NO
        Release-Direct:
          PROVISIONING_PROFILE_SPECIFIER: Yuzu NTFS FSKit Module Developer ID
    postBuildScripts:
      - name: Embed P0 git identity and assert KOIO declaration
        script: '"$SRCROOT/scripts/p0-build-identity.sh"'
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        basedOnDependencyAnalysis: false
      - name: Ad-hoc sign Debug FSKit module
        script: |
          if [ "$CONFIGURATION" = Debug ]; then
            /usr/bin/codesign --force --sign - \
              --entitlements "$SRCROOT/Module/YuzuNTFSModule.entitlements" \
              "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - package: NTFSCore
        product: NTFSProbe
      - package: NTFSCore
        product: EngineE2
      - package: NTFSCore
        product: NTFSBridge
      - sdk: FSKit.framework
      - sdk: ExtensionFoundation.framework
schemes:
  YuzuNTFS:
    build:
      targets:
        YuzuNTFS: all
