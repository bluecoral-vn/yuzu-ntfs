name: ✨ Feature request
description: Suggest an idea or improvement.
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Tell us about the moment you wished Yuzu NTFS could do this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, apps that do it well, etc.
