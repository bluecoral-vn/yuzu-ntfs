name: 🐞 Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Yuzu NTFS better! If any files were **lost or damaged**, please use the **Data safety** form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Plug in the drive
        2. Copy a file in Finder
        3. …
  - type: input
    id: app-version
    attributes:
      label: Yuzu NTFS version
      description: Shown when you click the Yuzu NTFS icon in the menu bar.
      placeholder: 0.1 Beta
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 27.0.1, MacBook Pro M4
    validations:
      required: true
  - type: input
    id: drive
    attributes:
      label: Drive
      description: Brand/model, size, how it's connected, and which Windows version last used it.
      placeholder: Samsung T7 1 TB, USB-C, Windows 11
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or error messages help a lot.
